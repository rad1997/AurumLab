 <script>

     function getAPIBase() {
    const serverIp = localStorage.getItem("serverIp");

    if (!serverIp) return null;

    return `http://${serverIp}/webAurumlab/api`;
}

     document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    const patientId = params.get("patientId");

    if (patientId) {
        document.getElementById("patientId").value = patientId;
    }
});
window.addEventListener("load", async () => {

    const patientId = document.getElementById("patientId").value.trim();
    const serverIp = localStorage.getItem("serverIp");

    const API_BASE = getAPIBase();

    if (!patientId || !serverIp || !API_BASE) {
        console.warn("Missing configuration");
        return;
    }

    try {

        // =========================
        // GET PATIENT DATA
        // =========================
        const response = await fetch(`http://${serverIp}/web%20Aurumlab/api/get_patient.php`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                patientId,
                serverIp
            })
        });

        const result = await response.json();

        if (!result.success) {
            alert(result.message);
            return;
        }

        document.getElementById("patientName").value = result.name || "";
        document.getElementById("dentist").value = result.dentist || "";
        document.getElementById("receiveDate").value = result.receiveDate || "";

        // =========================
        // LOAD TECH WORK TABLE
        // =========================
        await loadTechWork();

        // =========================
        // GET DENTIST NUMBER
        // =========================
        const dentistResponse = await fetch(`http://${serverIp}/web%20Aurumlab/api/get_dentist.php`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                dentist: result.dentist,
                serverIp
            })
        });

        const dentistResult = await dentistResponse.json();

        if (dentistResult.success) {
            document.getElementById("dentistNo").value =
                dentistResult.number || "";
        }

    } catch (err) {
        console.error(err);
        alert("Error loading dashboard data");
    }
});


async function loadTechWork() {

    const appointmentId =
        document.getElementById("patientId").value.trim();

    const serverIp = localStorage.getItem("serverIp");

    const API_BASE = `http://${serverIp}/webAurumlab/api`;

    if (!appointmentId || !serverIp) return;

    const response = await fetch(`http://${serverIp}/web%20Aurumlab/api/get_tech_work.php`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            appointmentId: appointmentId,
            serverIp: serverIp
        })
    });

    const data = await response.json();

    const tbody = document.getElementById("techWorkBody");
    tbody.innerHTML = "";

    if (!data.success || !data.rows.length) {
        tbody.innerHTML =
            `<tr><td colspan="7">No data found</td></tr>`;
        return;
    }

    data.rows.forEach(row => {

        tbody.innerHTML += `
            <tr>
                <td>${row.ID}</td>
                <td>${row.tech_name ?? ""}</td>
                <td>${row.tech_work ?? ""}</td>
                <td>${row.unit ?? ""}</td>
                <td>${row.tech_prices ?? ""}</td>
                <td>${row.work_date ?? ""}</td>
                <td>
                    <button class="btn-delete"
                        onclick="deleteRow(${row.ID})">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    });
}




function deleteRow(id) {

    if (!confirm("Delete this record?")) return;

    const serverIp = localStorage.getItem("serverIp");
    const API_BASE = `http://${serverIp}/webAurumlab/api`;

    fetch(`http://${serverIp}/web%20Aurumlab/api/delete_tech_work.php`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            id: id,
            serverIp: serverIp
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.success) {
            loadTechWork(); // refresh ONLY table
        } else {
            alert(data.message);
        }

    })
    .catch(err => {
        console.error(err);
        alert("Server error");
    });
}












window.addEventListener("DOMContentLoaded", function () {

loadTechWorkList();

    // ================================
    // AUTO PUT LOGGED USER IN DROPDOWNS
    // ================================
    window.addEventListener("DOMContentLoaded", function () {
    
        const username = localStorage.getItem("loggedUser");
    
        if (!username) return;
    
        const selects = [
            "castingTech",
            "prepTech",
            "designTech",
            "preFinishTech",
            "ceramistTech"
        ];
    
        selects.forEach(id => {
    
            const select = document.getElementById(id);
    
            if (!select) return;
    
            select.innerHTML = "";
    
            const defaultOpt = new Option("Select Technician", "");
            defaultOpt.disabled = true;
    
            select.add(defaultOpt);
    
            const userOpt = new Option(username, username);
            select.add(userOpt);
    
            // auto select username
            select.value = username;
        });
    });
    
    
    // ================================
    // ADD NUMBERS 1-32
    // ================================
    window.addEventListener("DOMContentLoaded", function () {
    
        const selects = [

    "castingNo",
    "prepNo",
    "designNo",
    "preFinishNo",
    "finishingNo"
];
    
        selects.forEach(id => {
    
            const select = document.getElementById(id);
    
            if (!select) return;
    
            select.innerHTML = "";
    
            const defaultOpt = document.createElement("option");
            defaultOpt.textContent = "No:";
            defaultOpt.value = "";
            defaultOpt.disabled = true;
            defaultOpt.selected = true;
    
            select.appendChild(defaultOpt);
    
            for (let i = 1; i <= 32; i++) {
    
                const opt = document.createElement("option");
    
                opt.value = i;
                opt.textContent = i;
    
                select.appendChild(opt);
            }
        });
    });
    
    
    // ================================
    // PRICE VARIABLES
    // ================================
    let castingPrice = 0;
    let prepPrice = 0;
    let designPrice = 0;
    let preFinishPrice = 0;
    let ceramistPrice = 0;
    
    
    // ================================
    // GET WORK PRICE
    // ================================
    async function getWorkPrice(work) {
    
        const serverIp = localStorage.getItem("serverIp");
    
       const response = await fetch(`${getApiUrl()}/get-work-price`, {
    
            method: "POST",
    
            headers: {
                "Content-Type": "application/json"
            },
    
            body: JSON.stringify({
    
                work: work,
    
                serverIp: localStorage.getItem("serverIp"),
    
                database: localStorage.getItem("database"),
    
                dbUser: localStorage.getItem("dbUser"),
    
                dbPassword: localStorage.getItem("dbPassword")
            })
        });
    
        const data = await response.json();
    
        if (data.success) {
    
            return data.price;
        }
    
        return 0;
    }
    
    
    // ================================
    // GET CASTING PRICE
    // ================================
    document.getElementById("castingType")
    .addEventListener("change", async function () {
    
        castingPrice = await getWorkPrice(this.value);
    
        console.log("Casting Price:", castingPrice);
    });
    
    
    // ================================
    // GET PREP PRICE
    // ================================
    document.getElementById("prepType")
    .addEventListener("change", async function () {
    
        prepPrice = await getWorkPrice(this.value);
    
        console.log("Prep Price:", prepPrice);
    });
    
    
    // ================================
    // GET DESIGN PRICE
    // ================================
    document.getElementById("designType")
    .addEventListener("change", async function () {
    
        designPrice = await getWorkPrice(this.value);
    
        console.log("Design Price:", designPrice);
    });
    
    
    // ================================
    // GET PREFINISH PRICE
    // ================================
    document.getElementById("preFinishType")
    .addEventListener("change", async function () {
    
        preFinishPrice = await getWorkPrice(this.value);
    
        console.log("PreFinish Price:", preFinishPrice);
    });
    
    
    // ================================
    // GET CERAMIST PRICE
    // ================================
    document.getElementById("ceramistType")
    .addEventListener("change", async function () {
    
        ceramistPrice = await getWorkPrice(this.value);
    
        console.log("Ceramist Price:", ceramistPrice);
    });

document.getElementById("btnSaveCasting")
.addEventListener("click", async function () {

    try {

        // ================================
        // GET VALUES
        // ================================
        const patientId = document.getElementById("patientId").value.trim();
        const patientName = document.getElementById("patientName").value.trim();
        const dentist = document.getElementById("dentist").value.trim();

        const techName =
            document.getElementById("castingTech").value;

        const techWork =
            document.getElementById("castingType").value;

        const unit =
            document.getElementById("castingNo").value;

        // ================================
        // VALIDATION
        // ================================
        if (!patientId || isNaN(patientId)) {

            alert("Invalid Patient ID");
            return;
        }

        if (!techName || !techWork || !unit) {

            alert("Please select Technician and Work Type");
            return;
        }

        // ================================
        // CALCULATE PRICE
        // ================================
        const hitPrices = parseInt(unit) * castingPrice;

        // ================================
        // SERVER IP
        // ================================
        const serverIp = localStorage.getItem("serverIp");

        // ================================
        // SAVE API
        // ================================
      const response = await fetch(`${getApiUrl()}/save-casting`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    appointmentid: patientId,
                    dentist: dentist,
                    patient_name: patientName,

                    tech_name: techName,
                    tech_work: techWork,

                    work_type: "Casting",

                    unit: unit,

                    status: "InProgress",

                    tech_prices: hitPrices,

                    work_date: new Date(),

                    serverIp: localStorage.getItem("serverIp"),
                    database: localStorage.getItem("database"),
                    dbUser: localStorage.getItem("dbUser"),
                    dbPassword: localStorage.getItem("dbPassword")
                })
            });

        const data = await response.json();

        // ================================
        // SUCCESS
        // ================================
        if (data.success) {

            alert("Casting Saved Successfully");

            // OPTIONAL REFRESH
              // 🔥 REFRESH TABLE
              const id = new URLSearchParams(window.location.search)
        .get("patientId");
           loadTechWorkList(id);
        }
        else {

            alert(data.message || "Save Failed");
        }

    }
    catch (error) {

        console.error(error);

        alert("Error Saving Casting");
    }
});

document.getElementById("btnComplete").addEventListener("click", async function () {

        body: JSON.stringify({ appointmentid: patientId })
    });

    if (!data.success) {
        alert("Update failed");
        return;
    }

    // 2. UPDATE APPOINTMENT TABLE

   await fetch(`${getApiUrl()}/update-appointment-status`, {
        method: "POST",

    const patientName = document.getElementById("patientName").value;
    const dentist = document.getElementById("dentist").value;
    const dentistNo = document.getElementById("dentistNo").value;
    const receiveDate = document.getElementById("receiveDate").value;

    const labSettings = JSON.parse(localStorage.getItem("labSettings")) || {};
    const labName = labSettings.labName || "AurumLab";
    const logo = labSettings.labLogo || "";

    // QR URL
    const qrUrl = `https://admirable-pastelito-c13624.netlify.app/?id=${patientId}`;

    // =========================
    // 4. GENERATE QR SAFELY

    const tempDiv = document.createElement("div");

    new QRCode(tempDiv, {
        text: qrUrl,
        width: 120,
        height: 120
    });

    // wait for QR rendering
    await new Promise(resolve => setTimeout(resolve, 400));

    const qrHtml = tempDiv.innerHTML;

    // =========================

    // =========================
    const printWindow = window.open("", "_blank");

    printWindow.document.write(`

                    text-align: left;

        </head>

// GET ELEMENTS
const logoInput = document.getElementById("labLogoInput");
const logoPreview = document.getElementById("logoPreview");

// ✔ ONLY ONE CLICK EVENT (IMPORTANT FIX)
logoPreview.addEventListener("click", function () {
    logoInput.click();
});

// ✔ LOAD IMAGE + SAVE
logoInput.addEventListener("change", function (event) {

    const file = event.target.files[0];

    if (file) {

        const reader = new FileReader();

        reader.onload = function (e) {

            logoPreview.src = e.target.result;

            // SAVE LOGO
            let settings = JSON.parse(localStorage.getItem("labSettings")) || {};
            settings.labLogo = e.target.result;

            localStorage.setItem("labSettings", JSON.stringify(settings));
        };

        reader.readAsDataURL(file);
    }
});

// ✔ SAVE LAB NAME
const settingsPanel = document.querySelector(".settings-panel");
const openBtn = document.getElementById("openSettingsBtn");

// OPEN / CLOSE TOGGLE
openBtn.addEventListener("click", function () {
    settingsPanel.classList.toggle("show");
});

// CLOSE AFTER SAVE
document.getElementById("saveSettings").addEventListener("click", function () {

    const name = document.getElementById("labNameInput").value;

    let settings = JSON.parse(localStorage.getItem("labSettings")) || {};
    settings.labName = name;

    localStorage.setItem("labSettings", JSON.stringify(settings));

    alert("Settings saved");

    // CLOSE PANEL AFTER SAVE
    settingsPanel.classList.remove("show");
});

// ✔ LOAD SETTINGS ON PAGE OPEN
window.addEventListener("DOMContentLoaded", function () {

    let settings = JSON.parse(localStorage.getItem("labSettings"));

    if (settings) {

        document.getElementById("labNameInput").value = settings.labName || "";

        if (settings.labLogo) {
            logoPreview.src = settings.labLogo;
        }
    }
});
