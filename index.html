<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>AurumLab Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
/* ========================= */
/* GLOBAL RESET + MOTION */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
    transition: all 0.25s ease;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
    position:relative;

    /* ❄️ MATTE COLD BLUE */
    background: #0b1b2b;
}


/* ========================= */
/* LOGIN CARD */
/* ========================= */

.login-container{
    position:relative;
    width:400px;
    padding:45px;

    border-radius:25px;

    background:rgba(20, 18, 10, 0.55);

    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);

    border:1px solid rgba(212,175,55,0.35);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.4),
        0 0 25px rgba(212,175,55,0.12);

    color:white;
    z-index:1;

    animation: cardFloat 6s ease-in-out infinite;
}

/* CARD HOVER */
.login-container:hover{
    transform: translateY(-6px) scale(1.01);
    box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        0 0 35px rgba(212,175,55,0.25);
}

/* ========================= */
/* CARD FLOAT */
/* ========================= */

@keyframes cardFloat{
    0%{ transform:translateY(0px); }
    50%{ transform:translateY(-8px); }
    100%{ transform:translateY(0px); }
}

/* ========================= */
/* SETTINGS BUTTON */
/* ========================= */

.settings-btn{
    position:absolute;
    top:18px;
    right:18px;

    width:42px;
    height:42px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:rgba(212,175,55,0.08);
    border:1px solid rgba(212,175,55,0.3);

    color:#d4af37;
    font-size:18px;

    cursor:pointer;


    box-shadow:0 0 10px rgba(212,175,55,0.15);

    animation: floatBtn 4s ease-in-out infinite;
}

.settings-btn:hover{
    transform:scale(1.15) rotate(20deg);
    box-shadow:0 0 25px rgba(212,175,55,0.4);
    background:rgba(212,175,55,0.15);
}

@keyframes floatBtn{
    0%{ transform:translateY(0px); }
    50%{ transform:translateY(-5px); }
    100%{ transform:translateY(0px); }
}

/* ========================= */
/* LOGO */
/* ========================= */

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo i{
    font-size:60px;
    color:#d4af37;
    text-shadow:0 0 15px rgba(212,175,55,0.5);
    margin-bottom:10px;
}

.logo h1{
    font-size:32px;
    color:#f5e6b3;
}

.logo p{
    color:#cbbf8a;
    font-size:14px;
}

/* ========================= */
/* INPUTS */
/* ========================= */

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:15px 45px 15px 15px;

    border-radius:14px;

    border:1px solid rgba(212,175,55,0.2);

    background:rgba(255,255,255,0.05);
    color:#fff;

    outline:none;

    transform:translateY(0);
}

.input-box input::placeholder{
    color:#cbbf8a;
}

.input-box input:hover{
    transform:translateY(-1px);
    border-color:rgba(212,175,55,0.5);
}

.input-box input:focus{
    border-color:#d4af37;
    box-shadow:0 0 18px rgba(212,175,55,0.5);
    transform:translateY(-2px);
}

/* ICONS */
.input-box i{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#d4af37;
}

/* ========================= */
/* BUTTON */
/* ========================= */

.login-btn{
    width:100%;
    padding:15px;

    border:none;
    border-radius:14px;

    background:linear-gradient(135deg,#d4af37,#b8860b);

    color:#1a1205;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    position:relative;
    overflow:hidden;

    box-shadow:0 10px 25px rgba(212,175,55,0.25);
}

.login-btn:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 15px 35px rgba(212,175,55,0.45);
}

.login-btn:active{
    transform:translateY(0px) scale(0.98);
}

/* ========================= */
/* SETTINGS PANEL */
/* ========================= */

.settings-panel{
    display:none;
    margin-top:20px;

    border-top:1px solid rgba(212,175,55,0.3);
    padding-top:15px;
}

.settings-panel input{
    width:100%;
    margin-bottom:10px;
    padding:12px;

    border-radius:10px;

    border:1px solid rgba(212,175,55,0.2);

    background:rgba(255,255,255,0.05);
    color:white;
}


.settings-panel{
    display:none;
    margin-top:25px;
    border-top:1px solid rgba(255,255,255,0.15);
    padding-top:20px;

    /* motion base */
    opacity:0;
    transform: translateY(-10px);
    transition: all 0.35s ease;
}

/* WHEN OPEN */
.settings-panel.show{
    display:block;
    opacity:1;
    transform: translateY(0);
}

/* INPUTS MOTION */
.settings-panel input{
    width:100%;
    margin-bottom:12px;
    padding:12px;

    border:none;
    border-radius:10px;

    outline:none;

    background:rgba(255,255,255,0.08);
    color:white;

    border:1px solid rgba(255,255,255,0.12);

    /* smooth motion */
    transform: translateY(10px);
    opacity:0;

    animation: inputFade 0.4s forwards;
}

/* STAGGER EFFECT */
.settings-panel input:nth-child(1){ animation-delay:0.05s; }
.settings-panel input:nth-child(2){ animation-delay:0.10s; }
.settings-panel input:nth-child(3){ animation-delay:0.15s; }
.settings-panel input:nth-child(4){ animation-delay:0.20s; }

/* ANIMATION */
@keyframes inputFade{
    to{
        transform: translateY(0);
        opacity:1;
    }
}

/* HOVER EFFECT */
.settings-panel input:hover{
    transform: scale(1.02);
    border-color: rgba(255,255,255,0.25);
}

/* FOCUS EFFECT */
.settings-panel input:focus{
    transform: scale(1.03);
    border-color: #38bdf8;
    box-shadow: 0 0 12px rgba(56,189,248,0.4);
}


/* ========================= */
/* FOOTER */
/* ========================= */

.footer{
    text-align:center;
    margin-top:20px;
    font-size:12px;
    color:#cbbf8a;
}


/* ========================= */
/* 📱 MOBILE / IPHONE SCALE SYSTEM */
/* ========================= */
/* ========================= */
/* 📱 REAL MOBILE APP STYLE (IPHONE FEEL) */
/* ========================= */

@media (max-width: 768px){

body{
    padding: 18px;
    align-items: center;
}

.login-container{
    width: 100%;
    max-width: 420px;

    padding: 26px;

    border-radius: 22px;

    /* REMOVE SCALE - use real spacing instead */
    transform: none;
}

.logo i{
    font-size: 46px;
}

.logo h1{
    font-size: 26px;
}

.logo p{
    font-size: 13px;
}

.input-box input{
    height: 48px;
    font-size: 14px;
}

.login-btn{
    height: 48px;
    font-size: 15px;
}

.settings-btn{
    width: 40px;
    height: 40px;
    font-size: 16px;
}
}

/* SMALL IPHONE (XR / 11 STYLE) */
@media (max-width: 480px){

body{
    padding: 14px;
}

.login-container{
    width: 100%;
    max-width: 100%;
    padding: 20px;

    border-radius: 20px;

    /* NO SCALE */
    transform: none;
}

.logo i{
    font-size: 40px;
}

.logo h1{
    font-size: 22px;
}

.input-box input{
    height: 46px;
    font-size: 13px;
}

.login-btn{
    height: 46px;
    font-size: 14px;
}

.settings-btn{
    width: 36px;
    height: 36px;
}
}
    </style>

</head>

<body>

    <div class="login-container">

        <!-- SETTINGS BUTTON -->
        <button
            class="settings-btn"
            onclick="toggleSettings()"
            title="Settings"
            aria-label="Settings">

            <i class="fa-solid fa-gear"></i>

        </button>

        <!-- LOGO -->
        <div class="logo">

            <i class="fa-solid fa-tooth"></i>

            <h1>AurumLab</h1>

            <p>Dental Lab Management System</p>

        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">

            <!-- USERNAME -->
            <div class="input-box">

                <input type="text"
                       id="username"
                       placeholder="Username"
                       required />

                <i class="fa-solid fa-user"></i>

            </div>

            <!-- PASSWORD -->
            <div class="input-box">

                <input type="password"
                       id="password"
                       placeholder="Password"
                       required />

                <i class="fa-solid fa-lock"></i>

            </div>

             <!-- PASSWORD -->
             <div class="input-box">

                <input type="text"
                id="PatientId"
                placeholder="PatientId"
                required />
                
                <i class="fa-solid fa-lock"></i>

            </div>
            
            <!-- LOGIN BUTTON -->
            <button type="submit"
                    class="login-btn">

                Login

            </button>

        </form>

        <!-- SETTINGS PANEL -->
        <div class="settings-panel" id="settingsPanel">

            <input type="text"
                   id="serverIp"
                   placeholder="SQL Server IP">
        
                   <input type="text"
                   id="dbUser"
                   placeholder="dbUser">

                   <input type="text"
                   id="dbPassword"
                   placeholder="dbPassword">

                   <input type="text"
                   id="database"
                   placeholder="database name">


                   <button type="button" class="login-btn" onclick="saveSettings(); checkServer();">
                    Save & Check Server
                </button>
        
        </div>

        <div class="footer">

            © 2026 AurumLab

        </div>

    </div>



    <!-- JAVASCRIPT -->
    <script>

        function toggleSettings() {
            let panel = document.getElementById("settingsPanel");
        
            if (panel.classList.contains("show")) {
                panel.classList.remove("show");
                setTimeout(() => panel.style.display = "none", 300);
            } else {
                panel.style.display = "block";
                setTimeout(() => panel.classList.add("show"), 10);
            }
        }
        
        /* =========================
           SAVE SETTINGS (FIXED)
        ========================= */
        function saveSettings(){

localStorage.setItem(
    "serverIp",
    document.getElementById("serverIp").value
);

localStorage.setItem(
    "dbUser",
    document.getElementById("dbUser").value
);

localStorage.setItem(
    "dbPassword",
    document.getElementById("dbPassword").value
);

localStorage.setItem(
    "database",
    document.getElementById("database").value
);

alert("Settings Saved");



// automatically test server after saving
checkServer();
}
        
        /* =========================
           STATUS
        ========================= */
        function showStatus(message) {
            const box = document.getElementById("statusBox");
            box.innerText = message;
            box.style.display = "block";
        
            setTimeout(() => box.style.display = "none", 4000);
        }
        
        /* =========================
           CHECK SERVER
        ========================= */
        async function checkServer() {

const serverIp = document.getElementById("serverIp").value.trim();

const url = `http://${serverIp}/web%20Aurumlab/api/connected.php`;

try {
    const response = await fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            serverIp: serverIp
        })
    });

    const text = await response.text();
    console.log("RAW RESPONSE:", text);

    const data = JSON.parse(text);

    showStatus(data.success ? "🟢 SQL SERVER CONNECTED" : "🔴 CONNECTION FAILED");

} catch (err) {
    console.error(err);
    showStatus("🔴 SERVER NOT REACHABLE");
}
}
        
 /* =========================
             LOGIN (FIXED)
  ========================= */
  
  document.getElementById("loginForm")
.addEventListener("submit", async function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const serverIp = localStorage.getItem("serverIp");

    if (!serverIp) {
        alert("Please configure server settings first.");
        return;
    }

    try {
        const response = await fetch("api/login.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password,
                serverIp
            })
        });

        const text = await response.text();
        console.log("RAW RESPONSE:", text);

        let result;
        try {
            result = JSON.parse(text);
        } catch (e) {
            console.error("Invalid JSON:", text);
            alert("Server error: invalid response");
            return;
        }

        if (result.success) {

              // Save server IP for dashboard page
    localStorage.setItem("serverIp", serverIp);
    
            const patientId =
                document.getElementById("PatientId").value.trim();

            localStorage.setItem("loggedUser", result.user.name);

            window.location.href =
                `dashboard.html?patientId=${encodeURIComponent(patientId)}`;

        } else {
            alert(result.message);
        }

    } catch (error) {
        console.error(error);
        alert("Connection error");
    }
});

        </script>


<div id="statusBox"
     style="
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 14px;
        background: rgba(0,0,0,0.6);
        color: white;
        display:none;
        z-index:9999;
     ">
</div>


</body>

</html>
